services:
  - type: web
    name: skillgraph-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/graph/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false
      - key: COGNODB_DATABASE
        value: neo4j
